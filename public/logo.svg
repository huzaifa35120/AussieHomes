<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" fill="none">
  <!-- House icon -->
  <g transform="translate(2, 4)">
    <!-- House body -->
    <polygon points="8,28 8,48 32,48 32,28" fill="#E05A2B"/>
    <!-- Roof -->
    <polygon points="2,30 20,10 38,30" fill="#C0392B"/>
    <!-- Window grid (2x2) -->
    <rect x="22" y="30" width="6" height="6" fill="white" opacity="0.9"/>
    <rect x="29" y="30" width="6" height="6" fill="white" opacity="0.9"/>
    <rect x="22" y="37" width="6" height="6" fill="white" opacity="0.9"/>
    <rect x="29" y="37" width="6" height="6" fill="white" opacity="0.9"/>
    <!-- Door -->
    <rect x="11" y="36" width="8" height="12" fill="#922B21"/>
    <!-- Chat bubble shapes below -->
    <rect x="4" y="50" width="14" height="8" rx="2" fill="#C0392B" opacity="0.8"/>
    <rect x="20" y="50" width="14" height="8" rx="2" fill="#E05A2B" opacity="0.8"/>
  </g>
  <!-- Company name -->
  <text x="52" y="28" font-family="Montserrat, Arial, sans-serif" font-weight="700" font-size="18" fill="#C0392B" letter-spacing="0.5">AUZI HOMES PTY LTD</text>
  <text x="52" y="43" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="10" fill="#666666">Building homes just got better</text>
</svg>
